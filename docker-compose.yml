services:
  server:
    build: ./server
    container_name: server
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:9.5
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: insight_quiz
      MYSQL_USER: sample
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: